<!doctype html>
<html lang="en">
  <head>
    <script src="/scene-transition.js?v=1"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cards.art</title>
    <link rel="icon" type="image/png" href="../cardnft.png">
    <link rel="apple-touch-icon" href="../cardnft.png">
    <link rel="stylesheet" href="./styles.css?v=binder-59">
    <script type="importmap">
      {
        "imports": {
          "three": "../vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="table" id="table">
      <section class="card-rig" aria-label="3D trading card viewer">
        <div class="scene-track">
          <div class="scene-panel" id="scenePanel">
            <canvas id="cardCanvas" aria-label="Rotatable trading card. Right-click to cycle the card color."></canvas>
          </div>
          <a class="full-art" id="fullArtLink" target="_blank" rel="noopener" aria-label="Open full artwork in a new tab">
            <img id="fullArtImage" alt="">
          </a>
          <div class="art-magnifier" id="artMagnifier" aria-hidden="true"></div>
        </div>
        <div class="button-row" aria-label="Card controls">
          <button class="icon-button" id="previousButton" type="button" aria-label="Previous card by author">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 18 9 12l6-6"></path>
            </svg>
          </button>
          <button class="icon-button" id="nextButton" type="button" aria-label="Next card by author">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>
          <button class="icon-button" id="shuffleButton" type="button" aria-label="Shuffle card">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 3h5v5"></path>
              <path d="M4 20 21 3"></path>
              <path d="M21 16v5h-5"></path>
              <path d="M15 15l6 6"></path>
              <path d="M4 4l5 5"></path>
            </svg>
          </button>
          <button class="icon-button" id="detailsButton" type="button" aria-label="Toggle full art" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="5" cy="12" r="1.7"></circle>
              <circle cx="12" cy="12" r="1.7"></circle>
              <circle cx="19" cy="12" r="1.7"></circle>
            </svg>
          </button>
          <button class="icon-button" id="favoriteButton" type="button" aria-label="Toggle favorite" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m12 3.6 2.55 5.16 5.7.83-4.12 4.02.97 5.68L12 16.6l-5.1 2.69.97-5.68-4.12-4.02 5.7-.83L12 3.6Z"></path>
            </svg>
          </button>
        </div>
        <div class="card-filename" id="cardFileName" aria-live="polite"></div>
        <div class="card-counter" id="cardCounter" aria-live="polite">--/101</div>
      </section>
      <section class="gallery-panel" id="galleryPanel" aria-label="Card gallery" hidden>
        <div class="gallery-grid" id="galleryGrid"></div>
        <div class="binder-panel" id="binderPanel" hidden>
          <canvas id="binderCanvas" aria-label="3D card binder"></canvas>
          <div class="binder-loading" id="binderLoading" hidden></div>
        </div>
        <div class="binder-page-controls" id="binderPageControls" aria-label="Binder page controls" hidden>
          <button class="icon-button" id="binderZoomOutButton" type="button" aria-label="Return to binder spread" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 19V5"></path>
              <path d="m5 12 7-7 7 7"></path>
            </svg>
          </button>
          <button class="icon-button" id="binderPreviousPageButton" type="button" aria-label="Previous binder page">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 18 9 12l6-6"></path>
            </svg>
          </button>
          <button class="icon-button" id="binderNextPageButton" type="button" aria-label="Next binder page">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>
          <button class="icon-button" id="binderShuffleButton" type="button" aria-label="Shuffle binder spread">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 3h5v5"></path>
              <path d="M4 20 21 3"></path>
              <path d="M21 16v5h-5"></path>
              <path d="M15 15l6 6"></path>
              <path d="M4 4l5 5"></path>
            </svg>
          </button>
          <button class="icon-button" id="binderOpenCardButton" type="button" aria-label="Open card view" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 11V6a2 2 0 0 1 4 0v4"></path>
              <path d="M12 10V5a2 2 0 0 1 4 0v6"></path>
              <path d="M16 11V7a2 2 0 0 1 4 0v7"></path>
              <path d="M8 11a2 2 0 0 0-4 0v3c0 4.4 3.6 8 8 8h1.5a6.5 6.5 0 0 0 6.5-6.5V14"></path>
            </svg>
          </button>
          <button class="icon-button" id="binderFavoriteButton" type="button" aria-label="Toggle favorite" aria-pressed="false" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m12 3.6 2.55 5.16 5.7.83-4.12 4.02.97 5.68L12 16.6l-5.1 2.69.97-5.68-4.12-4.02 5.7-.83L12 3.6Z"></path>
            </svg>
          </button>
        </div>
        <div class="binder-page-status" id="binderPageStatus" aria-live="polite" hidden></div>
        <div class="gallery-empty" id="galleryEmpty" hidden>No favorites yet</div>
      </section>
    </main>

    <button class="icon-button corner-gallery" id="galleryToggleButton" type="button" aria-label="Toggle gallery" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 4h6v6H4z"></path>
        <path d="M14 4h6v6h-6z"></path>
        <path d="M4 14h6v6H4z"></path>
        <path d="M14 14h6v6h-6z"></path>
      </svg>
    </button>

    <div class="binder-color-filters" id="binderColorFilters" aria-label="Filter binder by card color" hidden>
      <button class="binder-color-filter" type="button" data-card-color="white" aria-label="White cards" aria-pressed="false"></button>
      <button class="binder-color-filter" type="button" data-card-color="black" aria-label="Black cards" aria-pressed="false"></button>
      <button class="binder-color-filter" type="button" data-card-color="blue" aria-label="Blue cards" aria-pressed="false"></button>
      <button class="binder-color-filter" type="button" data-card-color="gold" aria-label="Gold cards" aria-pressed="false"></button>
      <button class="binder-color-filter" type="button" data-card-color="green" aria-label="Green cards" aria-pressed="false"></button>
      <button class="binder-color-filter" type="button" data-card-color="red" aria-label="Red cards" aria-pressed="false"></button>
    </div>

    <label class="binder-switch" aria-label="Toggle 3D binder">
      <input id="binderToggle" type="checkbox" checked>
      <span class="theme-switch__track" aria-hidden="true">
        <span class="theme-switch__thumb"></span>
      </span>
    </label>

    <label class="theme-switch" aria-label="Toggle light mode">
      <input id="themeToggle" type="checkbox">
      <span class="theme-switch__track" aria-hidden="true">
        <span class="theme-switch__thumb"></span>
      </span>
    </label>

    <button class="icon-button corner-upload" id="uploadButton" type="button" aria-label="Upload custom art">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <path d="M17 8 12 3 7 8"></path>
        <path d="M12 3v12"></path>
      </svg>
    </button>

    <button class="icon-button corner-favorites" id="favoriteFilterButton" type="button" aria-label="Show favorites" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m12 3.6 2.55 5.16 5.7.83-4.12 4.02.97 5.68L12 16.6l-5.1 2.69.97-5.68-4.12-4.02 5.7-.83L12 3.6Z"></path>
      </svg>
    </button>

    <div class="modal-backdrop" id="uploadModal" role="dialog" aria-modal="true" aria-labelledby="uploadTitle" aria-hidden="true">
      <div class="upload-dialog">
        <div class="upload-header">
          <h1 id="uploadTitle">Custom Card</h1>
          <button class="modal-close" id="closeUploadButton" type="button" aria-label="Close upload dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
        </div>

        <button class="drop-zone" id="dropZone" type="button">
          <span class="drop-zone__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <path d="M17 8 12 3 7 8"></path>
              <path d="M12 3v12"></path>
            </svg>
          </span>
          <span class="drop-zone__text" id="dropZoneText">Drop or choose an image</span>
        </button>
        <input class="visually-hidden" id="uploadInput" type="file" accept="image/*">

        <section class="crop-editor" aria-label="Card art crop">
          <canvas id="cropCanvas" width="640" height="472" aria-label="Crop preview"></canvas>
          <div class="crop-controls">
            <label>
              <span>Zoom</span>
              <input id="cropZoom" type="range" min="1" max="4" step="0.01" value="1">
            </label>
          </div>
        </section>

        <div class="field-grid">
          <label>
            <span>Title</span>
            <input id="customTitle" type="text" autocomplete="off" placeholder="Card title">
          </label>
          <label>
            <span>Author</span>
            <input id="customAuthor" type="text" autocomplete="off" placeholder="Artist name">
          </label>
          <label>
            <span>Date</span>
            <input id="customDate" type="text" autocomplete="off" placeholder="Year or date">
          </label>
        </div>

        <button class="create-button" id="createCardButton" type="button" disabled>
          <span>Create</span>
          <span class="create-spinner" aria-hidden="true"></span>
        </button>
      </div>
    </div>
    <script type="module" src="./app.js?v=binder-53"></script>
  </body>
</html>
