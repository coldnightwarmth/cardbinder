<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Note Cards</title><link rel="stylesheet" href="./gallery.css"><link rel="stylesheet" href="./tags.css?v=3"></head><body>
<header><label class="search"><input id="search" type="search" placeholder="Find a name or card number" aria-label="Find a card"></label><div id="zoom"><button id="minus" aria-label="Zoom out gallery" title="Show more columns">−</button><button id="plus" aria-label="Zoom in gallery" title="Show fewer columns">+</button></div><button id="view" aria-label="Show horizontal gallery" aria-pressed="false" title="Toggle horizontal gallery"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="8" y="4" width="8" height="16" rx="1.5"/><path d="M4 6H1v12h3M20 6h3v12h-3"/></svg></button></header>
<main><p id="status" role="status">Loading cards…</p><div id="grid"></div><nav id="navigation" aria-label="Gallery navigation" hidden><button id="previous" aria-label="Previous cards">←</button><button id="next" aria-label="Next cards">→</button></nav></main>
<dialog id="expanded" aria-label="Expanded card"><button id="close" aria-label="Close expanded card">×</button><div id="cardView"></div></dialog><script type="module" src="./gallery.js?v=6"></script></body></html>
